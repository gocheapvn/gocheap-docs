site_name: GO’Cheap Help Center
site_url: https://docs.gocheap.vn/
theme:
  name: material
  custom_dir: overrides
  palette:
    primary: custom
    accent: custom
  language: vi
  font: false
  logo: images/gocheap-horizontal.png
  icon:
    search: lucide/search
  favicon: images/favicon-gocheap-192.png?v=3.1
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
plugins:
  - search:
      lang: vi
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
extra_css:
  - assets/fonts/fonts.css
  - assets/css/custom.css?v=3.1
extra_javascript:
  - js/custom.js?v=3.1
extra:
  generator: false
not_in_nav: |
  /khach-hang/dich-vu.md
  /tai-xe/dich-vu.md
  /tai-xe/van-hoa-gocheap.md
  /doanh-nghiep/quan-ly-doi-xe-va-tai-xe.md
validation:
  links:
    not_found: warn
    anchors: warn
nav:
- Trang chủ: index.md
- Dành cho khách hàng:
  - Giới thiệu GO’Cheap: gioi-thieu.md
  - Cài đặt và đăng ký: khach-hang/cai-dat-app.md
  - Đặt tài xế lái xe hộ: khach-hang/thue-tai-xe.md
  - Đặt xe sân bay: khach-hang/dat-xe-san-bay.md
  - Thuê xe hợp đồng: khach-hang/thue-xe-hop-dong.md
  - Xe ghép tiện chuyến: khach-hang/xe-ghep-tien-chuyen.md
  - Giá dịch vụ và thanh toán: khach-hang/thanh-toan.md
  - Hủy chuyến, đổi lịch và hoàn tiền: khach-hang/huy-chuyen-hoan-tien.md
  - Bảo hiểm và xử lý sự cố: khach-hang/bao-hiem-va-su-co.md
- Dành cho đối tác tài xế:
  - Đăng ký và xét duyệt: tai-xe/thu-tuc-hop-tac.md
  - Đào tạo tài xế: tai-xe/dao-tao.md
  - Hướng dẫn sử dụng DriverX: tai-xe/huong-dan-su-dung-app.md
  - Quy trình nhận và thực hiện chuyến: tai-xe/nhan-va-thuc-hien-chuyen.md
  - Ví, doanh thu và hoa hồng: tai-xe/vi-doanh-thu-hoa-hong.md
  - Chính sách thưởng, phạt: tai-xe/thuong-phat.md
  - Quy định vận hành: tai-xe/hop-dong.md
- Dành cho khách hàng doanh nghiệp:
  - Giải pháp vận tải: doanh-nghiep/giai-phap-van-tai.md
  - Đăng ký hợp đồng: doanh-nghiep/dang-ky-hop-dong.md
  - Đặt xe theo giờ: doanh-nghiep/dat-xe-theo-gio.md
  - Quản lý đặt xe và chuyến: doanh-nghiep/dat-xe-quan-ly-chuyen.md
  - Thanh toán định kỳ và đối soát: doanh-nghiep/thanh-toan-dinh-ky.md
  - Hóa đơn và đối soát: doanh-nghiep/hoa-don-va-doi-soat.md
  - Xe hợp đồng và yêu cầu đặc biệt: doanh-nghiep/xe-hop-dong-yeu-cau.md
- Trung tâm hỗ trợ:
  - FAQ: ho-tro/faq.md
  - FAQ khách hàng: khach-hang/cau-hoi-thuong-gap.md
  - FAQ tài xế: tai-xe/cau-hoi-thuong-gap.md
  - Báo sự cố: ho-tro/bao-su-co.md
  - Liên hệ CSKH: ho-tro/lien-he.md
  - Khiếu nại và tranh chấp: ho-tro/khieu-nai-tranh-chap.md
  - Tài sản thất lạc: ho-tro/tai-san-that-lac.md
  - Tra cứu chính sách: ho-tro/chinh-sach.md
  - Chính sách và điều khoản:
    - Điều khoản sử dụng dịch vụ: ho-tro/dieu-khoan.md
    - Chính sách bảo vệ dữ liệu cá nhân: ho-tro/bao-mat.md
    - Chính sách giá và phụ phí: chinh-sach/gia-va-phu-phi.md
    - Chính sách hủy chuyến và hoàn tiền: chinh-sach/huy-chuyen-hoan-tien.md
    - Chính sách an toàn và trách nhiệm dịch vụ: chinh-sach/an-toan-trach-nhiem.md
